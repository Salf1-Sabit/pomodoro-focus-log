<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Focus Log</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Pomodoro Focus Log</h1>

      <section id="timer-section" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Timer</h2>
        <p id="timer-state" class="timer-state"></p>
        <p id="timer-display" class="timer-display" role="timer"></p>
        <p id="timer-cycle" class="muted"></p>
        <div class="label-field">
          <label for="label-input">What are you working on? (optional)</label>
          <input type="text" id="label-input" maxlength="60" autocomplete="off" aria-describedby="label-note" />
          <p id="label-note" class="muted note" role="status"></p>
        </div>
        <div class="controls">
          <button type="button" id="start-button">Start focus</button>
          <button type="button" id="pause-button" class="secondary">Pause</button>
          <button type="button" id="resume-button">Resume</button>
          <button type="button" id="cancel-button" class="secondary">Cancel</button>
        </div>
        <p class="muted shortcuts">Shortcuts: S start, P pause or resume, C cancel.</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p id="error" class="error" role="alert" aria-live="assertive"></p>
      </section>

      <section id="today-section" aria-labelledby="today-heading">
        <h2 id="today-heading">Today</h2>
        <p id="today-total" class="today-total"></p>
        <ul id="today-list" class="session-list"></ul>
        <p id="today-empty" class="muted">No focus sessions completed yet today.</p>
      </section>

      <section id="week-section" aria-labelledby="week-heading">
        <h2 id="week-heading">Last 7 days</h2>
        <ol id="week-chart" class="week-chart"></ol>
      </section>

      <section id="data-section" aria-labelledby="data-heading">
        <h2 id="data-heading">Your data</h2>
        <p class="muted">Everything is stored only in this browser. Nothing is sent anywhere.</p>
        <div class="controls">
          <button type="button" id="export-button" class="secondary">Export CSV</button>
          <button type="button" id="delete-button" class="danger">Delete log</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
